name: Team C - AI & Data Engine CI

on:
  push:
    paths:
      - "engine/**"
      - "data/**"
      - "contracts/rule_catalog.yaml"
      - "contracts/column_synonyms.yaml"
      - ".github/workflows/engine.yml"
  pull_request:
    paths:
      - "engine/**"
      - "data/**"
      - "contracts/rule_catalog.yaml"
      - "contracts/column_synonyms.yaml"
      - ".github/workflows/engine.yml"

jobs:
  test-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./engine[dev]"

      - name: Lint and Format Check (Ruff)
        run: |
          ruff check engine contracts
          ruff format --check engine contracts

      - name: Security Audit (Bandit)
        run: |
          bandit -r engine -s B101

      - name: Run Pytest
        run: |
          cd engine
          PYTHONPATH=.. python -c "from data.generator.generate import generate_dataset; generate_dataset()"
          mkdir -p data
          if [ -d "../data/demo" ]; then
            cp -r ../data/demo data/
          fi
          pytest -v