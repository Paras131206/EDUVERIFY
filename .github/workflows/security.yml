name: Security Audit & Scans

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "backend/**"
      - "engine/**"
      - "frontend/**"
      - ".github/workflows/security.yml"

jobs:
  static-security-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit
          pip install -r backend/requirements.txt
          pip install -e ./engine

      - name: Static Security Analysis (Bandit)
        run: |
          bandit -r backend engine -s B101,B104

      - name: Dependency Vulnerability Audit (pip-audit)
        run: |
          pip-audit -r backend/requirements.txt || true

      - name: Frontend Dependency Audit (npm audit)
        if: hashFiles('frontend/package.json') != ''
        run: |
          cd frontend && npm audit --audit-level=high || true

  zap-staging-scan:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ZAP Baseline Scan (Render Staging)
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "https://eduverify-api.onrender.com/healthz"
          rules_file_name: "infra/zap-rules.tsv"
          allow_issue_writing: false
          fail_action: false
