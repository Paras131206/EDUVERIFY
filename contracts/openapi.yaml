openapi: 3.1.0
info:
  title: EduVerify API
  version: 0.1.0
  description: |
    Central repository and verification trust layer for AICTE-approved institutions
    keyed by APAAR ID. Source of truth data contract per agents.md and requirements.md.
  contact:
    name: AICTE EduVerify Team
    url: https://eduverify.aicte-india.org
servers:
  - url: http://localhost:8000
    description: Local development server
  - url: https://eduverify-api.onrender.com
    description: Render staging/production environment

tags:
  - name: Health
    description: System liveness and diagnostic endpoints
  - name: Auth
    description: Authentication, token refresh, and user profile
  - name: Users
    description: User management and role assignment
  - name: API Keys
    description: Institution scoped API key management
  - name: Master Data
    description: Reference tables (LGD, institutions, programs, academic years, enums)
  - name: Templates
    description: Student bulk upload template generators
  - name: Registry
    description: Mock APAAR identity verification registry checks
  - name: Batches
    description: Ingestion pipeline, mapping confirmation, review, commit, and SSE stream
  - name: Issues
    description: Rule engine issue explanation and human review decision workflow
  - name: Corrections
    description: Audit-tracked record correction submissions
  - name: Duplicates
    description: Intra- and cross-institution duplicate clusters and resolution
  - name: Students
    description: Canonical student records and lifecycle state transitions
  - name: Transfers
    description: Inter-institution student transfer workflow and AICTE override
  - name: Aggregates
    description: Aggregate-only data submissions for non-onboarded institutions
  - name: Declared Totals
    description: Statistical intake totals from approval process
  - name: Reconciliation
    description: Program-level reconciliation between uploaded records and declared totals
  - name: Rollover
    description: Academic year progression and batch rollover automation
  - name: Consent
    description: DPDP Act student consent ledger and status management
  - name: Credentials
    description: SD-JWT Verifiable Credential issuance, key binding, and revocation
  - name: Verification
    description: Third-party authorized credential verification
  - name: Decentralized Identifiers
    description: did:web document and public key discovery
  - name: Status Lists
    description: Bitstring status lists for suspension and revocation
  - name: Webhooks
    description: HMAC-signed event notifications delivery
  - name: Notifications
    description: Outbox notifications monitoring
  - name: Reports
    description: Data quality before/after reports and accreditation exports
  - name: Audit
    description: Hash-chained tamper-evident audit trail
  - name: Dashboards
    description: Real-time analytics, coverage maps, and anomaly feeds

paths:
  /healthz:
    get:
      tags: [Health]
      summary: Health and readiness check
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service unhealthy or database unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /v1/auth/login:
    post:
      tags: [Auth]
      summary: Authenticate user credentials
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          headers:
            Set-Cookie:
              schema:
                type: string
                example: refresh_token=abc123; HttpOnly; Secure; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate refresh token and issue new access token
      operationId: refreshToken
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke active session and refresh token
      operationId: logout
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Successfully logged out

  /v1/auth/me:
    get:
      tags: [Auth]
      summary: Get authenticated user profile and roles
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/auth/password:
    post:
      tags: [Auth]
      summary: Change user password
      operationId: changePassword
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password updated
        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/users:
    get:
      tags: [Users]
      summary: List users with role filter
      operationId: listUsers
      security:
        - BearerAuth: []
      parameters:
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/UserRole'
        - name: institution_aicte_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserProfile'
    post:
      tags: [Users]
      summary: Create new system user
      operationId: createUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'

  /v1/users/{id}:
    get:
      tags: [Users]
      summary: Get user details by ID
      operationId: getUserById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
    put:
      tags: [Users]
      summary: Update user details or active status
      operationId: updateUser
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'

  /v1/api-keys:
    get:
      tags: [API Keys]
      summary: List active API keys for institution
      operationId: listApiKeys
      security:
        - BearerAuth: []
      responses:
        '200':
          description: API key list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiKeyMetadata'
    post:
      tags: [API Keys]
      summary: Generate scoped API key for institution
      operationId: createApiKey
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
      responses:
        '201':
          description: Key created (raw token returned once only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreatedResponse'

  /v1/api-keys/{id}:
    delete:
      tags: [API Keys]
      summary: Revoke an API key
      operationId: revokeApiKey
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: API key revoked

  /v1/master/states:
    get:
      tags: [Master Data]
      summary: List LGD state master records
      operationId: listStates
      responses:
        '200':
          description: States list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StateRecord'

  /v1/master/districts:
    get:
      tags: [Master Data]
      summary: List LGD district master records
      operationId: listDistricts
      parameters:
        - name: state_code
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Districts list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DistrictRecord'

  /v1/master/institutions:
    get:
      tags: [Master Data]
      summary: List AICTE-approved institutions
      operationId: listInstitutions
      parameters:
        - name: state_code
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Institutions list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InstitutionRecord'

  /v1/master/programs:
    get:
      tags: [Master Data]
      summary: List academic programs
      operationId: listPrograms
      parameters:
        - name: course_level
          in: query
          schema:
            $ref: '#/components/schemas/CourseLevel'
      responses:
        '200':
          description: Programs list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProgramRecord'

  /v1/master/academic-years:
    get:
      tags: [Master Data]
      summary: List academic years with admission windows
      operationId: listAcademicYears
      responses:
        '200':
          description: Academic years list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AcademicYearRecord'

  /v1/master/enums:
    get:
      tags: [Master Data]
      summary: Get localized enum options
      operationId: listEnums
      parameters:
        - name: lang
          in: query
          schema:
            type: string
            enum: [en, hi]
            default: en
      responses:
        '200':
          description: Enum mappings
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    $ref: '#/components/schemas/EnumItem'

  /v1/master/dabs:
    get:
      tags: [Master Data]
      summary: List Degree Awarding Bodies (DAB)
      operationId: listDabs
      responses:
        '200':
          description: DAB list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DabRecord'

  /v1/templates/student-upload.xlsx:
    get:
      tags: [Templates]
      summary: Download pre-formatted Excel template with APAAR text formatting and dropdowns
      operationId: getUploadTemplate
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Excel template file
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /v1/registry/{apaar}/check:
    get:
      tags: [Registry]
      summary: Check APAAR ID existence and return masked demographic match
      operationId: checkApaarRegistry
      security:
        - BearerAuth: []
      parameters:
        - name: apaar
          in: path
          required: true
          schema:
            type: string
            pattern: '^\d{12}$'
      responses:
        '200':
          description: Registry check result
          content:
            application/json:
              schema:
                type: object
                required: [exists, apaar_id]
                properties:
                  exists:
                    type: boolean
                  apaar_id:
                    type: string
                  match:
                    type: object
                    nullable: true
                    properties:
                      full_name_masked:
                        type: string
                      dob:
                        type: string
                      gender:
                        type: string

  /v1/batches:
    post:
      tags: [Batches]
      summary: Upload student data batch (CSV/Excel)
      operationId: createBatch
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, academic_year]
              properties:
                file:
                  type: string
                  format: binary
                academic_year:
                  type: string
                  example: "2026-27"
                supersedes_batch_id:
                  type: string
      responses:
        '202':
          description: Batch accepted for ingestion and mapping
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchSummary'
    get:
      tags: [Batches]
      summary: List batches for uploader institution
      operationId: listBatches
      security:
        - BearerAuth: []
      parameters:
        - name: academic_year
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/BatchStatus'
      responses:
        '200':
          description: Batches list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BatchSummary'

  /v1/batches/{id}:
    get:
      tags: [Batches]
      summary: Get batch status and progress
      operationId: getBatch
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Batch details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchSummary'

  /v1/batches/{id}/mapping:
    get:
      tags: [Batches]
      summary: Retrieve smart column mapping suggestions with confidence scores
      operationId: getBatchMapping
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Smart column mapping proposal
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ColumnMapping'

  /v1/batches/{id}/mapping/confirm:
    post:
      tags: [Batches]
      summary: Confirm or adjust column mapping and trigger rule validation
      operationId: confirmBatchMapping
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mappings]
              properties:
                mappings:
                  type: array
                  items:
                    $ref: '#/components/schemas/ColumnMapping'
      responses:
        '202':
          description: Mapping confirmed, validation started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchSummary'

  /v1/batches/{id}/report:
    get:
      tags: [Batches]
      summary: Retrieve full validation BatchReport
      operationId: getBatchReport
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Engine BatchReport
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchReport'

  /v1/batches/{id}/issues:
    get:
      tags: [Batches]
      summary: List validation issues with priority and bucket filters
      operationId: getBatchIssues
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: bucket
          in: query
          schema:
            $ref: '#/components/schemas/IssueBucket'
        - name: priority
          in: query
          schema:
            $ref: '#/components/schemas/IssuePriority'
      responses:
        '200':
          description: Filtered issues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Issue'

  /v1/batches/{id}/commit:
    post:
      tags: [Batches]
      summary: Commit clean and approved records into AICTE Central Repository
      operationId: commitBatch
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version:
                  type: integer
                  description: Optimistic concurrency version
      responses:
        '200':
          description: Batch committed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitResponse'
        '409':
          description: Concurrency conflict or unresolved critical issues
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/batches/{id}/supersede:
    post:
      tags: [Batches]
      summary: Mark an active batch as superseded by a newer upload
      operationId: supersedeBatch
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Batch superseded

  /v1/batches/{id}/events:
    get:
      tags: [Batches]
      summary: Server-Sent Events stream for batch processing progress
      operationId: streamBatchEvents
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string

  /v1/issues/{id}/decide:
    post:
      tags: [Issues]
      summary: Submit human review decision on an issue
      operationId: decideIssue
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueDecisionRequest'
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'

  /v1/corrections:
    get:
      tags: [Corrections]
      summary: List audit trail of approved corrections
      operationId: listCorrections
      security:
        - BearerAuth: []
      parameters:
        - name: batch_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Corrections list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CorrectionRecord'
    post:
      tags: [Corrections]
      summary: Propose or apply correction to an erroneous record
      operationId: submitCorrection
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectionRequest'
      responses:
        '201':
          description: Correction recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrectionRecord'

  /v1/duplicates:
    get:
      tags: [Duplicates]
      summary: List intra- and cross-institution duplicate clusters
      operationId: listDuplicates
      security:
        - BearerAuth: []
      parameters:
        - name: scope
          in: query
          schema:
            type: string
            enum: [INTRA, CROSS_INSTITUTION]
      responses:
        '200':
          description: Duplicate clusters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DuplicateCluster'

  /v1/duplicates/{id}/resolve:
    post:
      tags: [Duplicates]
      summary: Resolve a duplicate cluster decision
      operationId: resolveDuplicate
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DuplicateResolutionRequest'
      responses:
        '200':
          description: Duplicate cluster resolved

  /v1/students/{apaar_id}:
    get:
      tags: [Students]
      summary: Get student record from Central Repository
      operationId: getStudent
      security:
        - BearerAuth: []
      parameters:
        - name: apaar_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^\d{12}$'
      responses:
        '200':
          description: Student record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentRecord'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Students]
      summary: Update student record (creates new record version and supersedes credentials)
      operationId: updateStudent
      security:
        - BearerAuth: []
      parameters:
        - name: apaar_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentRecord'
      responses:
        '200':
          description: Student record updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentRecord'

  /v1/students/{apaar_id}/transitions:
    post:
      tags: [Students]
      summary: Perform lifecycle transition (WITHDRAWN, DEFERRED, TRANSFERRED_OUT, GRADUATED)
      operationId: createStudentTransition
      security:
        - BearerAuth: []
      parameters:
        - name: apaar_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleTransitionRequest'
      responses:
        '200':
          description: Lifecycle transition approved and applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentRecord'

  /v1/transfers:
    get:
      tags: [Transfers]
      summary: List student transfer requests
      operationId: listTransfers
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TransferStatus'
      responses:
        '200':
          description: Transfers list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransferRecord'
    post:
      tags: [Transfers]
      summary: Initiate student transfer request
      operationId: requestTransfer
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransferRequest'
      responses:
        '201':
          description: Transfer request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferRecord'

  /v1/transfers/{id}/decide:
    post:
      tags: [Transfers]
      summary: Source institution approve or reject transfer
      operationId: decideTransfer
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [APPROVED, REJECTED]
                remarks:
                  type: string
      responses:
        '200':
          description: Transfer decision applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferRecord'

  /v1/transfers/{id}/override:
    post:
      tags: [Transfers]
      summary: AICTE Admin override for stale or disputed transfers
      operationId: overrideTransfer
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reason]
              properties:
                decision:
                  type: string
                  enum: [APPROVED, REJECTED]
                reason:
                  type: string
      responses:
        '200':
          description: Transfer overridden
          content:
            application/json:
              schema:
