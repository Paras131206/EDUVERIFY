components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    CookieAuth:
      type: apiKey
      in: cookie
      name: refresh_token
  responses:
    Unauthorized:
      description: Authentication failed or token expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Role lacks required permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Invalid request payload or parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthResponse:
      type: object
      required:
      - status
      - version
      - engine_version
      - db
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
          example: 0.1.0
        engine_version:
          type: string
          example: 0.0.1
        db:
          type: string
          example: connected
    ErrorResponse:
      type: object
      required:
      - detail
      properties:
        detail:
          type: string
          example: Invalid credentials
        code:
          type: string
          example: AUTH_FAILED
    UserRole:
      type: string
      enum:
      - AICTE_ADMIN
      - AICTE_ANALYST
      - DAB_ADMIN
      - INSTITUTION_ADMIN
      - INSTITUTION_STAFF
      - VERIFIER
      - STUDENT
    CourseLevel:
      type: string
      enum:
      - DIPLOMA
      - UG
      - PG
      - PGDM
      - PHD
    BatchStatus:
      type: string
      enum:
      - UPLOADED
      - MAPPING
      - VALIDATING
      - VALIDATED
      - IN_REVIEW
      - COMMITTED
      - REJECTED
      - SUPERSEDED
      - FAILED
    IssueSeverity:
      type: string
      enum:
      - ERROR
      - WARN
      - INFO
    IssuePriority:
      type: string
      enum:
      - CRITICAL
      - HIGH
      - MEDIUM
      - LOW
    IssueBucket:
      type: string
      enum:
      - AUTO_FLAG
      - HUMAN_REVIEW
      - INFO
    TransferStatus:
      type: string
      enum:
      - PENDING
      - APPROVED
      - REJECTED
      - CANCELLED
      - OVERRIDDEN
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
        mfa_code:
          type: string
    LoginResponse:
      type: object
      required:
      - access_token
      - token_type
      - expires_in
      - user
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 900
        refresh_token:
          type: string
        user:
          $ref: '#/components/schemas/UserProfile'
    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
    UserProfile:
      type: object
      required:
      - id
      - email
      - full_name
      - role
      - is_active
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        full_name:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        institution_aicte_id:
          type: string
          nullable: true
        dab_id:
          type: string
          nullable: true
        is_active:
          type: boolean
        last_login_at:
          type: string
          format: date-time
          nullable: true
    CreateUserRequest:
      type: object
      required:
      - email
      - password
      - full_name
      - role
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
        full_name:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        institution_aicte_id:
          type: string
        dab_id:
          type: string
    UpdateUserRequest:
      type: object
      properties:
        full_name:
          type: string
        is_active:
          type: boolean
        role:
          $ref: '#/components/schemas/UserRole'
    ChangePasswordRequest:
      type: object
      required:
      - current_password
      - new_password
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 10
    ApiKeyMetadata:
      type: object
      required:
      - id
      - institution_aicte_id
      - name
      - prefix
      - scopes
      - created_at
      properties:
        id:
          type: string
        institution_aicte_id:
          type: string
        name:
          type: string
        prefix:
          type: string
        scopes:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
    CreateApiKeyRequest:
      type: object
      required:
      - name
      - scopes
      properties:
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
            enum:
            - upload
            - read
    ApiKeyCreatedResponse:
      type: object
      required:
      - id
      - name
      - prefix
      - raw_key
      - scopes
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
        raw_key:
          type: string
          description: Full secret key, displayed only once upon generation
        scopes:
          type: array
          items:
            type: string
    StateRecord:
      type: object
      required:
      - lgd_state_code
      - name
      - name_hi
      properties:
        lgd_state_code:
          type: integer
        name:
          type: string
        name_hi:
          type: string
    DistrictRecord:
      type: object
      required:
      - lgd_district_code
      - lgd_state_code
      - name
      properties:
        lgd_district_code:
          type: integer
        lgd_state_code:
          type: integer
        name:
          type: string
    InstitutionRecord:
      type: object
      required:
      - institution_aicte_id
      - name
      - state_code
      - district_code
      - type
      - affiliated_dab_id
      - onboarding_level
      properties:
        institution_aicte_id:
          type: string
        name:
          type: string
        state_code:
          type: integer
        district_code:
          type: integer
        type:
          type: string
        affiliated_dab_id:
          type: string
        onboarding_level:
          type: string
          enum:
          - FULL
          - AGGREGATE_ONLY
        did:
          type: string
    ProgramRecord:
      type: object
      required:
      - program_code
      - name
      - course_level
      - department
      - duration_years
      - lateral_allowed
      properties:
        program_code:
          type: string
        name:
          type: string
        course_level:
          $ref: '#/components/schemas/CourseLevel'
        department:
          type: string
        duration_years:
          type: integer
        lateral_allowed:
          type: boolean
    AcademicYearRecord:
      type: object
      required:
      - academic_year
      - start_date
      - end_date
      - admission_window_start
      - admission_window_end
      - is_current
      properties:
        academic_year:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        admission_window_start:
          type: string
          format: date
        admission_window_end:
          type: string
          format: date
        is_current:
          type: boolean
    EnumItem:
      type: object
      required:
      - value
      - label_en
      - label_hi
      properties:
        value:
          type: string
        label_en:
          type: string
        label_hi:
          type: string
    DabRecord:
      type: object
      required:
      - dab_id
      - name
      - type
      - state_code
      - did
      properties:
        dab_id:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
          - UNIVERSITY
          - DEEMED
          - AUTONOMOUS_INSTITUTION
        state_code:
          type: integer
        did:
          type: string
    ColumnMapping:
      type: object
      required:
      - source
      - target
      - confidence
      - method
      properties:
        source:
          type: string
        target:
          type: string
        confidence:
          type: number
          minimum: 0.0
          maximum: 1.0
        method:
          type: string
          enum:
          - synonym
          - fuzzy
          - user
          - sniffed
          - exact
    BatchSummary:
      type: object
      required:
      - batch_id
      - institution_aicte_id
      - academic_year
      - status
      - version
      - created_at
      properties:
        batch_id:
          type: string
        institution_aicte_id:
          type: string
        academic_year:
          type: string
        status:
          $ref: '#/components/schemas/BatchStatus'
        rows_total:
          type: integer
          default: 0
        quality_score:
          type: number
          nullable: true
        version:
          type: integer
          default: 1
        created_at:
          type: string
          format: date-time
    SuggestedFix:
      type: object
      required:
      - value
      - rationale
      - requires_approval
      properties:
        value: {}
        rationale:
          type: string
        requires_approval:
          type: boolean
          default: true
    Issue:
      type: object
      required:
      - issue_id
      - field
      - rule_id
      - severity
      - priority
      - confidence
      - bucket
      - message
      - reason
      properties:
        issue_id:
          type: string
        row:
          type: integer
          nullable: true
        record_key:
          type: string
          nullable: true
        field:
          type: string
        rule_id:
          type: string
        severity:
          $ref: '#/components/schemas/IssueSeverity'
        priority:
          $ref: '#/components/schemas/IssuePriority'
        confidence:
          type: number
        bucket:
          $ref: '#/components/schemas/IssueBucket'
        message:
          type: string
        reason:
          type: string
        evidence:
          type: object
        suggested_fix:
          $ref: '#/components/schemas/SuggestedFix'
          nullable: true
        value_masked:
          type: string
          nullable: true
    BatchReport:
      type: object
      required:
      - batch_id
      - institution_aicte_id
      - engine_version
      - rule_catalog_version
      - rows_total
      - quality_score
      - issues
      properties:
        batch_id:
          type: string
        institution_aicte_id:
          type: string
        engine_version:
          type: string
        rule_catalog_version:
          type: string
        rows_total:
          type: integer
        rows_valid:
