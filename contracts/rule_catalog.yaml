catalog_version: "1.0.0"
owner: "team-c"
description: "Validation rule catalog for EduVerify (V001–V035) per agents.md §6"
rules:
  - id: "V001"
    name: "Required column missing after column mapping"
    severity: "ERROR"
    default_priority: "CRITICAL"
    bucket_policy: "AUTO_FLAG"
    owner: "team-c"
    since_version: "0.1.0"
    description: "One or more mandatory canonical student_record columns could not be mapped from uploaded headers."
    fix_hint: "Map the unmapped column manually or check spreadsheet header names."

  - id: "V002"
    name: "apaar_id missing or not 12 digits"
    severity: "ERROR"
    default_priority: "CRITICAL"
    bucket_policy: "AUTO_FLAG"
    owner: "team-c"
    since_version: "0.1.0"
    description: "The APAAR ID is null, empty, or does not consist of exactly 12 numeric digits."
    fix_hint: "Ensure APAAR ID is formatted as text with leading zeros and contains exactly 12 digits."

  - id: "V003"
    name: "apaar_id not in APAAR registry"
    severity: "ERROR"
    default_priority: "CRITICAL"
    bucket_policy: "AUTO_FLAG"
    owner: "team-c"
    since_version: "0.1.0"
    description: "The provided APAAR ID does not exist in the national APAAR verification registry."
    fix_hint: "Verify student APAAR number with the student's DigiLocker or APAAR card."

  - id: "V004"
    name: "Registry name/DOB fuzzy mismatch"
    severity: "WARN"
    default_priority: "HIGH"
    bucket_policy: "HUMAN_REVIEW"
    owner: "team-c"
    since_version: "0.1.0"
    description: "Uploaded student name or date of birth differs from the registered demographic details in APAAR registry."
    fix_hint: "Review student's Aadhaar/APAAR identity document to resolve spelling or date discrepancy."

  - id: "V005"
    name: "Required field null/empty"
    severity: "ERROR"
    default_priority: "HIGH"
    bucket_policy: "AUTO_FLAG"
    owner: "team-c"
    since_version: "0.1.0"
    description: "A mandatory canonical field has empty or null values."
    fix_hint: "Provide the missing value for this required field."

  - id: "V006"
    name: "Invalid format"
    severity: "ERROR"
    default_priority: "LOW"
    bucket_policy: "AUTO_FLAG"
    owner: "team-c"
    since_version: "0.1.0"
    description: "Value does not conform to required syntax (date, enum, email, mobile, or ISO country code)."
    fix_hint: "Correct formatting to standard ISO format, valid email syntax, 10-digit mobile, or standard enum."

  - id: "V007"
    name: "Duplicate apaar_id within batch"
    severity: "ERROR"
    default_priority: "CRITICAL"
    bucket_policy: "AUTO_FLAG"
    owner: "team-c"
    since_version: "0.1.0"
    description: "The same APAAR ID appears more than once within the uploaded batch."
    fix_hint: "Remove duplicate rows or verify if two students were accidentally assigned the same APAAR."

  - id: "V008"
    name: "Duplicate institution_student_id within institution + year"
    severity: "ERROR"
    default_priority: "CRITICAL"
    bucket_policy: "AUTO_FLAG"
    owner: "team-c"
    since_version: "0.1.0"
    description: "The institution's internal student ID (Roll No / PRN) is already assigned to another student in this academic year."
    fix_hint: "Assign a unique institution roll/PRN number to each enrolled student."

  - id: "V009"
    name: "Probable same person, different APAAR, same batch"
    severity: "WARN"
    default_priority: "HIGH"
    bucket_policy: "HUMAN_REVIEW"
    owner: "team-c"
    since_version: "0.1.0"
    description: "Fuzzy demographic comparison detected matching name, DOB, and gender with conflicting APAAR IDs within the same batch."
    fix_hint: "Examine whether this student was registered twice under duplicate or erroneous identity numbers."

  - id: "V010"
    name: "Same APAAR ACTIVE at another institution in same year"
    severity: "ERROR"
    default_priority: "CRITICAL"
    bucket_policy: "AUTO_FLAG"
    owner: "team-c"
    since_version: "0.1.0"
    description: "Student is actively enrolled at another institution in the central repository with no approved transfer on record."
    fix_hint: "Initiate formal transfer request before uploading enrolment, or verify APAAR identity."

  - id: "V011"
    name: "Probable same person at another institution under different APAAR"
    severity: "WARN"
    default_priority: "HIGH"
    bucket_policy: "HUMAN_REVIEW"
    owner: "team-c"
    since_version: "0.1.0"
    description: "Demographic details closely match an active student record at another institution under a different APAAR."
    fix_hint: "Investigate possible dual admission or mismatched identity records with AICTE analyst."

  - id: "V012"
    name: "Regular-seat enrolment exceeds approved intake"
    severity: "ERROR"
    default_priority: "HIGH"
    bucket_policy: "AUTO_FLAG"
    owner: "team-c"
    since_version: "0.1.0"
    description: "The number of active regular enrolments in this program exceeds the AICTE-approved intake capacity."
    fix_hint: "Verify total seat allocation against AICTE Approval Letter for the academic year."

  - id: "V013"
    name: "Supernumerary count exceeds allowed scheme quota"
    severity: "ERROR"
    default_priority: "HIGH"
    bucket_policy: "AUTO_FLAG"
    owner: "team-c"
    since_version: "0.1.0"
    description: "Enrolment under a specific supernumerary scheme (e.g. TFW, PMSSS, J&K, FN) exceeds allowed ceiling."
    fix_hint: "Review scheme quota limits in the AICTE Approval Process Handbook."

  - id: "V014"
    name: "Quota and nationality inconsistent"
    severity: "ERROR"
    default_priority: "HIGH"
    bucket_policy: "AUTO_FLAG"
    owner: "team-c"
    since_version: "0.1.0"
    description: "Contradiction between student nationality, quota, and NRI/OCI/FN status flags."
    fix_hint: "Align student nationality with appropriate quota category (e.g. Indian national cannot have FN status)."

  - id: "V015"
    name: "Invalid seat type and scheme combination"
    severity: "ERROR"
    default_priority: "HIGH"
    bucket_policy: "AUTO_FLAG"
    owner: "team-c"
    since_version: "0.1.0"
    description: "Supernumerary scheme specified for a regular seat, or supernumerary seat missing scheme designation."
    fix_hint: "Specify supernumerary scheme only if seat_type is SUPERNUMERARY."

  - id: "V016"
    name: "Age implausible for course level"
    severity: "WARN"
    default_priority: "MEDIUM"
    bucket_policy: "HUMAN_REVIEW"
    owner: "team-c"
    since_version: "0.1.0"
    description: "Calculated age from date of birth falls outside customary range for UG, PG, or PhD programs."
    fix_hint: "Verify date of birth against matriculation certificate."

  - id: "V017"
    name: "admission_date outside academic-year window"
    severity: "ERROR"
    default_priority: "HIGH"
    bucket_policy: "AUTO_FLAG"
    owner: "team-c"
    since_version: "0.1.0"
    description: "Student admission date is outside the approved AICTE admission cutoff window for this academic year."
    fix_hint: "Ensure admission date falls within the prescribed AICTE calendar admission dates."

  - id: "V018"
    name: "Consent missing or minor lacking guardian consent"
    severity: "ERROR"
    default_priority: "HIGH"
    bucket_policy: "AUTO_FLAG"
    owner: "team-c"
    since_version: "0.1.0"
    description: "Mandatory student consent is missing, or student is under 18 without affirmative guardian consent."
    fix_hint: "Obtain and record verified student or parental consent in accordance with DPDP Act 2023."

  - id: "V019"
    name: "program_code not approved for institution/year"
    severity: "ERROR"
    default_priority: "HIGH"
    bucket_policy: "AUTO_FLAG"
    owner: "team-c"
    since_version: "0.1.0"
    description: "The specified program code is not present in AICTE master list of approved programs for this institution."
    fix_hint: "Select valid AICTE approved program code from the institutional approval master."

  - id: "V020"
    name: "Batch metric anomaly vs institution history"
    severity: "WARN"
    default_priority: "MEDIUM"
    bucket_policy: "HUMAN_REVIEW"
    owner: "team-c"
    since_version: "0.1.0"
    description: "Statistical outlier detected in demographic proportions, NRI/supernumerary share, or null rates."
    fix_hint: "Review institution intake profile for unexpected anomalies or data entry deviations."

  - id: "V021"
    name: "Invalid lifecycle transition"
    severity: "ERROR"
    default_priority: "HIGH"
    bucket_policy: "AUTO_FLAG"
    owner: "team-c"
    since_version: "0.1.0"
    description: "Disallowed transition between student lifecycle states (e.g. GRADUATED to ACTIVE)."
    fix_hint: "Follow valid lifecycle state progression per system transition policy."

  - id: "V022"
    name: "Uploaded counts differ from declared statistical totals"
    severity: "WARN"
    default_priority: "HIGH"
    bucket_policy: "HUMAN_REVIEW"
    owner: "team-c"
    since_version: "0.1.0"
    description: "Total uploaded student-level records differ from aggregate totals declared during approval process."
    fix_hint: "Reconcile student upload count with declared numbers in AICTE Approval Portal."

  - id: "V023"
    name: "APAAR/ID looks Excel-mangled"
    severity: "WARN"
    default_priority: "HIGH"
    bucket_policy: "AUTO_FLAG"
    owner: "team-c"
    since_version: "0.1.0"
    description: "Identifier appears corrupted by spreadsheet auto-formatting (scientific notation, lost leading zeros, or .0 suffix)."
    fix_hint: "Format APAAR/ID column as Text before entering numbers to preserve 12 digits."

  - id: "V024"
    name: "Ambiguous or unparseable date"
    severity: "ERROR"
    default_priority: "MEDIUM"
    bucket_policy: "HUMAN_REVIEW"
    owner: "team-c"
    since_version: "0.1.0"
    description: "Date string cannot be reliably parsed under the Indian date policy (DD-MM-YYYY) or has impossible month/day."
    fix_hint: "Format all dates in canonical ISO YYYY-MM-DD or standard DD/MM/YYYY."

  - id: "V025"
    name: "expected_graduation_year inconsistent with admission year + duration"
    severity: "ERROR"
    default_priority: "HIGH"
    bucket_policy: "AUTO_FLAG"
    owner: "team-c"
    since_version: "0.1.0"
    description: "Graduation year does not match admission year plus program duration (adjusted for lateral entry)."
    fix_hint: "Set expected graduation year to admission year + program duration (- 1 if lateral entry)."

  - id: "V026"
    name: "Conflicting course/department/level for same student across rows"
    severity: "ERROR"
    default_priority: "HIGH"
    bucket_policy: "AUTO_FLAG"
    owner: "team-c"
    since_version: "0.1.0"
    description: "Multiple rows for the same student identifier cite conflicting course level or department."
    fix_hint: "Confirm single enrolled program affiliation for the student in this academic year."

  - id: "V027"
    name: "year_of_study exceeds program duration or invalid for lateral"
    severity: "ERROR"
    default_priority: "HIGH"
    bucket_policy: "AUTO_FLAG"
    owner: "team-c"
    since_version: "0.1.0"
    description: "Year of study exceeds total program duration, or lateral entry student recorded in Year 1."
    fix_hint: "Ensure year of study is within 1 to duration_years (lateral entry starts at year 2)."

  - id: "V028"
    name: "Schema drift: required column removed or type changed"
    severity: "WARN"
    default_priority: "MEDIUM"
    bucket_policy: "HUMAN_REVIEW"
    owner: "team-c"
    since_version: "0.1.0"
    description: "A column present in previous committed batches is missing or has fundamentally changed data type."
    fix_hint: "Restore missing columns or confirm intentional file schema modification."

  - id: "V029"
    name: "Schema drift: new unseen category value"
    severity: "WARN"
    default_priority: "LOW"
    bucket_policy: "INFO"
    owner: "team-c"
    since_version: "0.1.0"
    description: "A categorical column contains a new distinct value not observed in prior institutional uploads."
    fix_hint: "Review new category values to ensure compliance with canonical enums."

  - id: "V030"
    name: "Missing-ID or null-rate jump vs previous batch"
    severity: "WARN"
    default_priority: "HIGH"
    bucket_policy: "HUMAN_REVIEW"
    owner: "team-c"
    since_version: "0.1.0"
    description: "Null rate or missing identity rate jumped significantly compared to institution's historical baseline."
    fix_hint: "Check if data export from institution ERP was truncated or corrupted."

  - id: "V031"
    name: "Formatting inconsistency"
    severity: "INFO"
    default_priority: "LOW"
    bucket_policy: "INFO"
    owner: "team-c"
    since_version: "0.1.0"
    description: "Inconsistent capitalization, extra whitespace, or mixed case that can be safely auto-normalized."
    fix_hint: "Standardize name casing and trim leading/trailing whitespace."

  - id: "V032"
    name: "Transfer pending: APAAR active elsewhere with transfer request open"
    severity: "WARN"
    default_priority: "HIGH"
    bucket_policy: "HUMAN_REVIEW"
    owner: "team-c"
    since_version: "0.1.0"
    description: "Student is actively enrolled at another institution, but a formal transfer request is currently pending approval."
    fix_hint: "Wait for source institution or AICTE to approve transfer before finalizing enrolment."

  - id: "V033"
    name: "Record references institution not affiliated to degree-awarding body"
    severity: "ERROR"
    default_priority: "HIGH"
    bucket_policy: "AUTO_FLAG"
    owner: "team-c"
    since_version: "0.1.0"
    description: "Institution AICTE ID is not recognized as affiliated to the stated university or degree-awarding body."
    fix_hint: "Verify university affiliation in institutional accreditation records."

  - id: "V034"
    name: "Student marked ACTIVE in previous year missing from rollover batch"
    severity: "WARN"
    default_priority: "MEDIUM"
    bucket_policy: "HUMAN_REVIEW"
    owner: "team-c"
    since_version: "0.1.0"
    description: "An active student from the preceding year is absent in the current year rollover without documented withdrawal."
    fix_hint: "Record withdrawal, transfer, or include continuing student in rollover batch."

  - id: "V035"
    name: "Batch institution does not match authenticated uploader"
    severity: "ERROR"
    default_priority: "CRITICAL"
    bucket_policy: "AUTO_FLAG"
    owner: "team-c"
    since_version: "0.1.0"
    description: "Records contain institution AICTE ID different from the authenticated user's institution credentials."
    fix_hint: "Upload records corresponding only to your authenticated institution."
