[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eduverify_engine"
version = "0.0.1"
description = "Pure Python rule, data validation and deduplication engine for EduVerify"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "EduVerify Team C (AI / Data)" }]
dependencies = [
    "pandas>=2.2.0,<4.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "openpyxl>=3.1.0",
    "charset-normalizer>=3.3.0",
    "rapidfuzz>=3.9.0",
    "jellyfish>=1.0.0",
    "scikit-learn>=1.5.0",
    "pyyaml>=6.0.0",
    "numpy>=1.26.0,<3.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0"
]
splink = [
    "splink>=4.0.0,<5.0.0",
    "duckdb>=1.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["eduverify_engine*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = [".", ".."]
