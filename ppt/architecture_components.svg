<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="400" viewBox="0 0 1080 400" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker>
    <g id="person"><circle cx="0" cy="-5" r="5.5" fill="#fff"/><path d="M-10,11 a10,9 0 0,1 20,0 z" fill="#fff"/></g>
  </defs>

  <rect x="1.5" y="1.5" width="1077" height="397" fill="#fff" stroke="#7b3fe4" stroke-width="3"/>
  <text x="16" y="34" font-size="21" font-weight="bold" fill="#3c7a7f">SYSTEM ARCHITECTURE</text>

  <!-- users -->
  <text x="16" y="88" font-size="10.5" font-weight="bold" fill="#6b7280" letter-spacing="1">USERS</text>
  <g font-size="12.5" font-weight="bold" fill="#1f2d4f">
    <circle cx="36" cy="132" r="20" fill="#3a7d7e"/><use href="#person" x="36" y="132"/><text x="62" y="137">Institutions</text>
    <circle cx="36" cy="212" r="20" fill="#3a7d7e"/><use href="#person" x="36" y="212"/><text x="62" y="217">AICTE</text>
    <circle cx="36" cy="292" r="20" fill="#3a7d7e"/><use href="#person" x="36" y="292"/><text x="62" y="297">Verifiers</text>
  </g>

  <!-- web interface -->
  <rect x="170" y="62" width="168" height="288" rx="10" fill="#eef6f6" stroke="#3a7d7e" stroke-width="1.6"/>
  <text x="254" y="84" font-size="10.5" font-weight="bold" fill="#3a7d7e" letter-spacing="1" text-anchor="middle">WEB INTERFACE</text>
  <g fill="#fff" stroke="#3a7d7e" stroke-width="1.5">
    <rect x="184" y="110" width="140" height="44" rx="6"/><rect x="184" y="190" width="140" height="44" rx="6"/><rect x="184" y="270" width="140" height="44" rx="6"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#1f2d4f" text-anchor="middle">
    <text x="254" y="137">Institution portal</text><text x="254" y="217">AICTE dashboard</text><text x="254" y="297">Verifier portal</text>
  </g>

  <g stroke="#4a5568" stroke-width="1.4" marker-end="url(#a)">
    <line x1="146" y1="132" x2="182" y2="132"/><line x1="146" y1="212" x2="182" y2="212"/><line x1="146" y1="292" x2="182" y2="292"/>
  </g>
  <!-- gateway -->
  <line x1="338" y1="206" x2="352" y2="206" stroke="#4a5568" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="354" y="62" width="44" height="288" rx="6" fill="#1f2d4f"/>
  <text transform="translate(372,206) rotate(-90)" font-size="12.5" font-weight="bold" fill="#fff" text-anchor="middle" letter-spacing="1">SECURE API GATEWAY</text>
  <text transform="translate(389,206) rotate(-90)" font-size="10.5" fill="#cbd5e1" text-anchor="middle">sign-in · roles · consent</text>
  <line x1="398" y1="206" x2="412" y2="206" stroke="#4a5568" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- application services -->
  <rect x="414" y="62" width="430" height="288" rx="10" fill="#f6f8fa" stroke="#4a5568" stroke-width="1.6"/>
  <text x="629" y="84" font-size="10.5" font-weight="bold" fill="#4a5568" letter-spacing="1" text-anchor="middle">APPLICATION SERVICES</text>
  <g stroke-width="1.6">
    <rect x="430" y="98" width="196" height="64" rx="6" fill="#fff" stroke="#4a5568"/>
    <rect x="634" y="98" width="196" height="64" rx="6" fill="#fff" stroke="#4a5568"/>
    <rect x="430" y="178" width="196" height="64" rx="6" fill="#fff" stroke="#4a5568"/>
    <rect x="634" y="178" width="196" height="64" rx="6" fill="#fff8ee" stroke="#e39a32" stroke-width="1.8"/>
    <rect x="430" y="258" width="196" height="64" rx="6" fill="#fff" stroke="#4a5568"/>
    <rect x="634" y="258" width="196" height="64" rx="6" fill="#fff" stroke="#4a5568"/>
  </g>
  <g text-anchor="middle">
    <g font-size="14" font-weight="bold" fill="#1f2d4f">
      <text x="528" y="126">Upload &amp; mapping</text><text x="732" y="126">Validation engine</text>
      <text x="528" y="206">Duplicate detection</text><text x="732" y="206">Review module</text>
      <text x="528" y="286">Reports &amp; dashboards</text><text x="732" y="286">Credential service</text>
    </g>
    <g font-size="11.5" fill="#4b5563">
      <text x="528" y="145">files and APIs</text><text x="732" y="145">rules, intake limits</text>
      <text x="528" y="225">across institutions</text><text x="732" y="225">approve / correct</text>
      <text x="528" y="305">monitoring, policy</text><text x="732" y="305">verifiable records</text>
    </g>
  </g>

  <!-- database with sections -->
  <line x1="845" y1="206" x2="877" y2="206" stroke="#4a5568" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="972" y="84" font-size="10.5" font-weight="bold" fill="#6b7280" letter-spacing="1" text-anchor="middle">DATABASE</text>
  <path d="M880,106 v190 a92,11 0 0,0 184,0 v-190" fill="#e8eef5" stroke="#1f2d4f" stroke-width="1.6"/>
  <path d="M880,169 a92,11 0 0,0 184,0 v63 a92,11 0 0,1 -184,0 z" fill="#dde6f1"/>
  <g fill="none" stroke="#1f2d4f" stroke-width="1.3"><path d="M880,169 a92,11 0 0,0 184,0"/><path d="M880,232 a92,11 0 0,0 184,0"/></g>
  <ellipse cx="972" cy="106" rx="92" ry="11" fill="#f3f6fa" stroke="#1f2d4f" stroke-width="1.6"/>
  <g font-size="13.5" font-weight="bold" fill="#1f2d4f" text-anchor="middle">
    <text x="972" y="148">Student records</text><text x="972" y="211">Audit trail</text><text x="972" y="274">Reference data</text>
  </g>

  <!-- external -->
  <rect x="880" y="324" width="184" height="34" rx="6" fill="#fff" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="972" y="346" font-size="12.5" font-weight="bold" fill="#374151" text-anchor="middle">APAAR registry (external)</text>
  <line x1="845" y1="341" x2="877" y2="341" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="4 3" marker-start="url(#a)" marker-end="url(#a)"/>
</svg>
