<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="400" viewBox="0 0 1080 400" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b2bb5"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e39a32"/></marker>
    <g id="person"><circle cx="0" cy="-6" r="6" fill="#fff"/><path d="M-11,12 a11,10 0 0,1 22,0 z" fill="#fff"/></g>
  </defs>

  <rect x="1.5" y="1.5" width="1077" height="397" fill="#fff" stroke="#7b3fe4" stroke-width="3"/>
  <text x="16" y="31" font-size="21" font-weight="bold" fill="#3c7a7f">SYSTEM ARCHITECTURE</text>

  <!-- users -->
  <text x="24" y="78" font-size="10.5" font-weight="bold" fill="#6b7280" letter-spacing="1">USERS</text>
  <g font-size="13.5" font-weight="bold" fill="#1f2d4f">
    <circle cx="48" cy="128" r="22" fill="#3a7d7e"/><use href="#person" x="48" y="128"/><text x="80" y="133">Institutions</text>
    <circle cx="48" cy="210" r="22" fill="#3a7d7e"/><use href="#person" x="48" y="210"/><text x="80" y="215">AICTE</text>
    <circle cx="48" cy="292" r="22" fill="#3a7d7e"/><use href="#person" x="48" y="292"/><text x="80" y="297">Verifiers</text>
  </g>
  <g stroke="#5b2bb5" stroke-width="1.5" marker-end="url(#a)">
    <line x1="176" y1="128" x2="210" y2="128"/><line x1="176" y1="210" x2="210" y2="210"/><line x1="176" y1="292" x2="210" y2="292"/>
  </g>

  <!-- secure zone -->
  <rect x="212" y="56" width="610" height="300" rx="22" fill="#f7f4ff" stroke="#7b3fe4" stroke-width="1.8" stroke-dasharray="8 5"/>
  <text x="234" y="80" font-size="12" font-weight="bold" fill="#5b2bb5" letter-spacing="1">SECURE ZONE</text>

  <!-- spokes -->
  <g stroke="#b8b4c9" stroke-width="1.5">
    <line x1="470" y1="186" x2="410" y2="152"/><line x1="530" y1="186" x2="590" y2="152"/>
    <line x1="470" y1="240" x2="410" y2="274"/><line x1="530" y1="240" x2="590" y2="274"/>
  </g>

  <!-- hub -->
  <circle cx="500" cy="213" r="46" fill="#3c7a7f"/>
  <text x="500" y="218" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle" letter-spacing="1">CORE</text>

  <!-- modules: titles only -->
  <g text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1f2d4f">
    <rect x="250" y="104" width="170" height="48" rx="24" fill="#e6f2f2" stroke="#3a7d7e" stroke-width="1.6"/><text x="335" y="133">Ingest</text>
    <rect x="580" y="104" width="170" height="48" rx="24" fill="#e8eef5" stroke="#1f2d4f" stroke-width="1.6"/><text x="665" y="133">Validate</text>
    <rect x="250" y="274" width="170" height="48" rx="24" fill="#f1f2f4" stroke="#6b7280" stroke-width="1.6"/><text x="335" y="303">Alerts</text>
    <rect x="580" y="274" width="170" height="48" rx="24" fill="#f1ecff" stroke="#7b3fe4" stroke-width="1.6"/><text x="665" y="303">Reports &amp; verify</text>
  </g>
  <line x1="420" y1="128" x2="578" y2="128" stroke="#5b2bb5" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- correction workflow (unchanged) -->
  <rect x="690" y="184" width="120" height="58" rx="5" fill="#fff8ee" stroke="#e39a32" stroke-width="1.8"/>
  <text x="750" y="208" font-size="13.5" font-weight="bold" fill="#1f2d4f" text-anchor="middle">Human review</text>
  <text x="750" y="226" font-size="11.5" fill="#4b5563" text-anchor="middle">approve / correct</text>
  <line x1="722" y1="152" x2="722" y2="181" stroke="#e39a32" stroke-width="1.5" marker-end="url(#o)"/>
  <path d="M700,184 Q690,168 684,155" fill="none" stroke="#e39a32" stroke-width="1.5" marker-end="url(#o)"/>
  <text x="750" y="260" font-size="10.5" font-style="italic" font-weight="bold" fill="#b3741d" text-anchor="middle">fixes re-validated</text>

  <!-- database -->
  <line x1="824" y1="213" x2="868" y2="213" stroke="#5b2bb5" stroke-width="2.2" marker-start="url(#a)" marker-end="url(#a)"/>
  <path d="M872,128 v170 a90,12 0 0,0 180,0 v-170" fill="#e8eef5" stroke="#1f2d4f" stroke-width="1.6"/>
  <ellipse cx="962" cy="128" rx="90" ry="12" fill="#f3f6fa" stroke="#1f2d4f" stroke-width="1.6"/>
  <text x="962" y="214" font-size="15" font-weight="bold" fill="#1f2d4f" text-anchor="middle">Database</text>
  <text x="962" y="234" font-size="12" fill="#4b5563" text-anchor="middle">records + audit trail</text>
</svg>
