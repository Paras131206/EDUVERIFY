<svg xmlns="http://www.w3.org/2000/svg" width="700" height="640" viewBox="0 0 700 640" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2d4f"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e39a32"/></marker>
  </defs>

  <rect x="1.5" y="1.5" width="697" height="637" fill="#fff" stroke="#7b3fe4" stroke-width="3"/>
  <text x="22" y="38" font-size="21" font-weight="bold" fill="#3c7a7f">END-TO-END WORKFLOW</text>

  <!-- main spine arrows -->
  <g stroke="#1f2d4f" stroke-width="1.8" marker-end="url(#g)">
    <line x1="319" y1="142" x2="319" y2="160"/>
    <line x1="319" y1="242" x2="319" y2="260"/>
    <line x1="319" y1="312" x2="319" y2="330"/>
    <line x1="319" y1="412" x2="319" y2="430"/>
  </g>

  <!-- stage chips -->
  <g font-weight="bold" fill="#fff" text-anchor="middle">
    <rect x="22" y="62" width="86" height="80" rx="6" fill="#3a7d7e"/>
    <text x="65" y="98" font-size="22">1</text><text x="65" y="120" font-size="12" letter-spacing="1">INGEST</text>
    <rect x="22" y="162" width="86" height="80" rx="6" fill="#4a5568"/>
    <text x="65" y="198" font-size="22">2</text><text x="65" y="220" font-size="12" letter-spacing="1">VERIFY</text>
    <rect x="22" y="332" width="86" height="80" rx="6" fill="#1f2d4f"/>
    <text x="65" y="368" font-size="22">3</text><text x="65" y="390" font-size="12" letter-spacing="1">STORE</text>
    <rect x="22" y="432" width="86" height="80" rx="6" fill="#7b3fe4"/>
    <text x="65" y="468" font-size="22">4</text><text x="65" y="490" font-size="12" letter-spacing="1">USE</text>
  </g>

  <!-- one box per stage -->
  <g text-anchor="middle">
    <rect x="118" y="62" width="402" height="80" rx="6" fill="#fff" stroke="#3a7d7e" stroke-width="1.8"/>
    <text x="319" y="96" font-size="15" font-weight="bold" fill="#1f2d4f">Submit and standardise records</text>
    <text x="319" y="117" font-size="12.5" fill="#4b5563">against AICTE-approved intake</text>

    <rect x="118" y="162" width="402" height="80" rx="6" fill="#fff" stroke="#4a5568" stroke-width="1.8"/>
    <text x="319" y="196" font-size="15" font-weight="bold" fill="#1f2d4f">Automated checks</text>
    <text x="319" y="217" font-size="12.5" fill="#4b5563">format, consistency, intake limits, duplicates</text>

    <rect x="118" y="332" width="402" height="80" rx="6" fill="#e8eef5" stroke="#1f2d4f" stroke-width="1.8"/>
    <text x="319" y="366" font-size="15" font-weight="bold" fill="#1f2d4f">Save verified record</text>
    <text x="319" y="387" font-size="12.5" fill="#4b5563">with status and audit history</text>

    <rect x="118" y="432" width="402" height="80" rx="6" fill="#fff" stroke="#7b3fe4" stroke-width="1.8"/>
    <text x="319" y="466" font-size="15" font-weight="bold" fill="#1f2d4f">Monitor, report and verify</text>
    <text x="319" y="487" font-size="12.5" fill="#4b5563">dashboards, reports, consent-based checks</text>
  </g>

  <!-- decision -->
  <polygon points="319,262 394,287 319,312 244,287" fill="#fbe3c4" stroke="#e39a32" stroke-width="1.8"/>
  <text x="319" y="292" font-size="13" font-weight="bold" fill="#8a5a17" text-anchor="middle">Issues found?</text>
  <text x="328" y="326" font-size="11" font-weight="bold" font-style="italic" fill="#6b7280">NO</text>
  <line x1="394" y1="287" x2="540" y2="287" stroke="#e39a32" stroke-width="1.5" marker-end="url(#o)"/>
  <text x="446" y="280" font-size="11" font-weight="bold" font-style="italic" fill="#b3741d">YES</text>

  <!-- review & update loop (unchanged) -->
  <rect x="534" y="226" width="144" height="280" rx="8" fill="#fff8ee" stroke="#e39a32" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="606" y="244" font-size="10.5" font-weight="bold" fill="#b3741d" text-anchor="middle" letter-spacing="0.5">REVIEW &amp; UPDATE</text>
  <g font-size="12.5" fill="#1f2d4f" text-anchor="middle">
    <rect x="542" y="255" width="128" height="64" rx="6" fill="#fff" stroke="#e39a32" stroke-width="1.8"/>
    <text><tspan x="606" y="283">Authorised reviewer</tspan><tspan x="606" y="299">examines the flag</tspan></text>
    <rect x="542" y="339" width="128" height="64" rx="6" fill="#fff" stroke="#e39a32" stroke-width="1.8"/>
    <text><tspan x="606" y="367">Approve / correct /</tspan><tspan x="606" y="383">reject; logged</tspan></text>
    <rect x="542" y="423" width="128" height="64" rx="6" fill="#fff" stroke="#e39a32" stroke-width="1.8"/>
    <text><tspan x="606" y="451">Institution fixes</tspan><tspan x="606" y="467">or updates record</tspan></text>
  </g>
  <g stroke="#e39a32" stroke-width="1.5" marker-end="url(#o)">
    <line x1="606" y1="319" x2="606" y2="337"/>
    <line x1="606" y1="403" x2="606" y2="421"/>
  </g>
  <polyline points="606,487 606,530 688,530 688,202 522,202" fill="none" stroke="#e39a32" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#o)"/>
  <text x="604" y="194" font-size="10.5" font-weight="bold" fill="#b3741d" text-anchor="middle">verified again</text>

  <!-- footer legend -->
  <line x1="22" y1="566" x2="678" y2="566" stroke="#e5e7eb"/>
  <rect x="22" y="582" width="34" height="16" rx="3" fill="#fff" stroke="#4a5568" stroke-width="1.6"/>
  <text x="64" y="595" font-size="12" fill="#555">main flow</text>
  <rect x="150" y="582" width="34" height="16" rx="3" fill="#fff8ee" stroke="#e39a32" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="192" y="595" font-size="12" fill="#555">review and update loop</text>
  <rect x="345" y="582" width="34" height="16" rx="3" fill="#e8eef5" stroke="#1f2d4f" stroke-width="1.6"/>
  <text x="387" y="595" font-size="12" fill="#555">trusted central record</text>
  <text x="22" y="622" font-size="11.5" fill="#6b7280">Every step is role-checked and consent-gated.</text>
</svg>
