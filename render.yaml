envVarGroups:
  - name: eduverify-dev-env
    envVars:
      - key: ENV
        value: dev
      - key: PUBLIC_BASE_URL
        value: http://localhost:8000
      - key: FRONTEND_URL
        value: http://localhost:5173
      - key: CORS_ORIGINS
        value: "http://localhost:5173,http://localhost:3000,http://localhost:8000"

  - name: eduverify-staging-env
    envVars:
      - key: ENV
        value: staging
      - key: PUBLIC_BASE_URL
        value: https://eduverify-api-staging.onrender.com
      - key: FRONTEND_URL
        value: https://eduverify-web-staging.onrender.com
      - key: CORS_ORIGINS
        value: "https://eduverify-web-staging.onrender.com"

  - name: eduverify-prod-env
    envVars:
      - key: ENV
        value: prod
      - key: PUBLIC_BASE_URL
        value: https://eduverify-api.onrender.com
      - key: FRONTEND_URL
        value: https://eduverify-web.onrender.com
      - key: CORS_ORIGINS
        value: "https://eduverify-web.onrender.com"

services:
  - type: web
    name: eduverify-api
    runtime: python
    plan: free
    rootDir: .
    buildCommand: "pip install -r backend/requirements.txt && pip install ./engine"
    startCommand: "cd backend && (test ! -f alembic.ini || alembic upgrade head) && (python -c 'import app.seed' 2>/dev/null && python -m app.seed --if-empty || true) && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /healthz
    envVars:
      - fromGroup: eduverify-prod-env # Switch to eduverify-staging-env on staging branch
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: eduverify-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FERNET_KEY
        generateValue: true
      - key: PEPPER
        generateValue: true
      - key: SEED_PASSWORD
        sync: false
      - key: ISSUER_KEYS_JSON
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false

  - type: web
    name: eduverify-web
    runtime: static
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: eduverify-api
          property: host

databases:
  - name: eduverify-db
    plan: free
    databaseName: eduverify
    user: eduverify
    postgresMajorVersion: 16
